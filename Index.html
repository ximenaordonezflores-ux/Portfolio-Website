<!doctype html>
<html lang="en">
  <head>
    <title>Bootstrap Example</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Using bootstrap 5 framework-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!--Bootstrap JavaScript-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!--jQuery used to load the navbar-->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>

  <body>
    <!-- Navbar gets added here -->
    <div id="nav-placeholder"></div>
    <!-- Here is where your div container(s) will go with your web page content-->

    <div class="container mt-4">
      <h1>My Portfolio</h1>
      <img
        src="Images/halloween.jpg"
        alt="Halloween photo"
        class="img-fluid"
        height="160"
        width="160"
      />
      <p>Portfolio Website</p>

      <img
        src="Images/storm.png"
        alt="Profile photo of Ximena"
        class="rounded"
        height="160"
        width="160"
      />
      <!--Added an image and organized it to make it look good.-->
      <h1>Hello, GitHub! I'm Ximena</h1>
      <p>
        This is my first web page using version control with Git and GitHub.
      </p>
      <p>
        I am learning to edit and version websites using VS Code, Git, and
        GitHub.
      </p>
      <a
        href="https://docs.google.com/document/d/1mL2W1f6WMbSCizAZVDLHCp5G6r5uaHMO3SNzBXrw96A/edit?tab=t.0"
        target="_blank"
        >Try it out!</a
      >
      <!--This link sends you to a Google Doc. -->
      <ol>
        <li>Discada Tacos</li>
        <li>Tortas</li>
        <li>Red Tamales</li>
      </ol>
    </div>
    <!--This is my favorite food to eat.-->
    <script>
      // Load only the #site-nav element
      $("#nav-placeholder").load("navbar.html #site-nav");
    </script>
  </body>
</html>
